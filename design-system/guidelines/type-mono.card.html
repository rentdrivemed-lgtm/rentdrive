<!-- @dsCard group="Type" viewport="700x180" name="Geist Mono — figures & data" subtitle="Prices, plates, dates, metrics" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-end; }
  .item { display: grid; gap: 6px; }
  .tag { font-family: var(--font-sans); font-size: 11px; color: var(--text-muted); }
  .mono { font-family: var(--font-mono); color: var(--text); font-feature-settings: 'tnum' 1; }
  .price { color: var(--accent); font-weight: 600; }
  .plate { background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 6px 12px; letter-spacing: 0.08em; }
</style>
</head>
<body>
  <div class="item"><span class="tag">Precio /día</span><span class="mono price" style="font-size:30px">$120.000</span></div>
  <div class="item"><span class="tag">Placa</span><span class="mono plate" style="font-size:22px">KXR&nbsp;482</span></div>
  <div class="item"><span class="tag">Fechas</span><span class="mono" style="font-size:22px">12 — 16 jun</span></div>
  <div class="item"><span class="tag">Ingresos mes</span><span class="mono" style="font-size:30px">$3.480.000</span></div>
</body>
</html>
