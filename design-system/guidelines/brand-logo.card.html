<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px; background: var(--bg); display: flex; align-items: center; gap: 40px; flex-wrap: wrap; }
  .tile { display: grid; gap: 12px; justify-items: center; }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .onlight { background: var(--text); padding: 16px 22px; border-radius: var(--radius-md); }
  img { display: block; }
</style>
</head>
<body>
  <div class="tile"><img src="../assets/logo-wordmark.svg" width="210" height="58" alt="DrivePass"><span class="tag">wordmark · on dark</span></div>
  <div class="tile"><img src="../assets/logo-mark.svg" width="56" height="56" alt="DrivePass mark"><span class="tag">mark</span></div>
  <div class="tile"><div class="onlight"><img src="../assets/logo-mark.svg" width="44" height="44" alt="DrivePass mark"></div><span class="tag">mark · on light</span></div>
</body>
</html>
