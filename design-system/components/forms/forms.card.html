<!-- @dsCard group="Components" viewport="700x620" name="Forms — actions, fields & toggles" subtitle="Button · Input · Select · Checkbox · Radio · Switch" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); }
  .grid { display: grid; gap: 22px; max-width: 660px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .lbl { font: var(--fw-semibold) 11px var(--font-mono); color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button, Input, Select, Checkbox, Radio, Switch, IconButton } = window.DrivePassDesignSystem_1a34f0;
  const Heart = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>;
  const Mail = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>;
  const Arrow = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>;

  function Demo() {
    return (
      <div className="grid">
        <div>
          <div className="lbl">Button — variants</div>
          <div className="row">
            <Button variant="primary" iconRight={<Arrow/>}>Reservar ahora</Button>
            <Button variant="secondary">Ver más</Button>
            <Button variant="ghost">Cancelar</Button>
            <Button variant="danger">Eliminar</Button>
          </div>
        </div>
        <div>
          <div className="lbl">Button — sizes · loading · disabled · icon</div>
          <div className="row">
            <Button size="sm">Pequeño</Button>
            <Button size="md">Mediano</Button>
            <Button size="lg">Grande</Button>
            <Button loading>Procesando</Button>
            <Button disabled>Deshabilitado</Button>
            <IconButton label="Guardar"><Heart/></IconButton>
          </div>
        </div>
        <div>
          <div className="lbl">Fields</div>
          <div className="two">
            <Input label="Correo" type="email" placeholder="tu@correo.com" icon={<Mail/>} required />
            <Input label="Contraseña" type="password" defaultValue="123" error="Credenciales incorrectas" />
            <Select label="Ubicación" defaultValue="med"><option value="med">Medellín</option><option>Envigado</option></Select>
            <Input label="Celular" placeholder="300 000 0000" help="Te contactaremos por aquí" />
          </div>
        </div>
        <div>
          <div className="lbl">Choice & toggle</div>
          <div className="row" style={{gap:'24px'}}>
            <Checkbox label="Acepto los términos" defaultChecked />
            <Radio name="r" label="Usuario" defaultChecked />
            <Radio name="r" label="Propietario" />
            <Switch label="Disponible" defaultChecked />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
